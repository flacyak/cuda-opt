name: CUDA Kernel Benchmark

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
jobs:
  benchmark:
    runs-on: [self-hosted, linux, gpu]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: uv setup
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: python setup
        run: uv python install 3.14

      - name: env and dependencies
        run: |
          uv venv --python3.14
          .venv/bin/pip/install --upgrade pip
          uv pip install numba cupy-cuda12x numpy

      - name: run benchmarks
        run: |
          .venv/bin/python naive_kernel/main.py
